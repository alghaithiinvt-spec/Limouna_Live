name: Build Limona V3 - Icon Fix

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Prepare Project
        run: |
          rm -rf android
          mkdir -p web
          if [ ! -f "web/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://limona.live"></head><body>Loading...</body></html>' > web/index.html
          fi
          npm install
          
      - name: Add Android
        run: npx cap add android
        
      - name: Fix Duplicate Icon Error
        run: |
          echo "Deleting duplicate XML icons..."
          # هذا هو الحل للمشكلة اللي في صورتك
          find android/app/src/main/res -name "ic_launcher*.xml" -delete
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          
          echo "Now replacing with lemon icon..."
          if [ -f "icon.png" ]; then
            for d in android/app/src/main/res/mipmap-*; do
              cp icon.png "$d/ic_launcher.png"
              cp icon.png "$d/ic_launcher_round.png"
            done
            echo "Icons replaced successfully!"
          else
            echo "icon.png not found"
            ls -la
          fi
          
      - name: Build APK
        run: |
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: limona-lemon-final
          path: android/app/build/outputs/apk/debug/app-debug.apk
