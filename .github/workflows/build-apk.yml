name: Build Limona V2 - Icon Fix

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install dependencies
        run: npm install
        
      - name: Add Android & Replace Icon
        run: |
          npx cap add android
          # هذا السطر هو اللي بيغير الأيقونة اللي في صورتك
          find android/app/src/main/res -name "ic_launcher*.png" -exec rm {} \;
          for dir in android/app/src/main/res/mipmap-*; do
            cp icon.png "$dir/ic_launcher.png"
            cp icon.png "$dir/ic_launcher_round.png"
            cp icon.png "$dir/ic_launcher_foreground.png"
          done
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: limona-v2-lemon-icon
          path: android/app/build/outputs/apk/debug/app-debug.apk
