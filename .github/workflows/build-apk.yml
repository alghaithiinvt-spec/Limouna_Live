name: Build Limouna V9 - Icon Fix

on: 
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Project
        run: |
          cd Limouna_Live
          if [ -f "web/manifest.json" ]; then
            sed -i 's|"https://limouna.live"|"/Limouna_Live/web"|g' web/manifest.json || true
          fi
          npm install

      - name: Add Android
        run: |
          cd Limouna_Live
          npx cap add android || true
          npx cap copy android

      - name: Fix Duplicate Icon Error
        run: |
          cd Limouna_Live
          echo "Deleting duplicate XML icons..."
          find android -name "ic_launcher.xml" -delete || true
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          
          echo "Now replacing with Limouna icon..."
          if [ -f "icon.png" ]; then
            for d in android/app/src/main/res/mipmap-*; do
              cp icon.png "$d/ic_launcher.png" || true
              cp icon.png "$d/ic_launcher_round.png" || true
            done
            echo "Icons replaced successfully"
          fi

      - name: Build APK
        run: |
          cd Limouna_Live
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: limouna-final
          path: Limouna_Live/android/app/build/outputs/apk/debug/app-debug.apk
