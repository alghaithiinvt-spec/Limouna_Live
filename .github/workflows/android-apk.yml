
name: Build Limouna Live APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.limouna.live",
            "appName": "Limouna Live",
            "webDir": "web"
          }
          EOF

      - name: Verify web files
        run: test -f web/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Limouna-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
