
name: Build Limouna Live APK

on: [workflow_dispatch, push]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify web app
        run: |
          if [ ! -f web/index.html ]; then
            echo "ERROR: web/index.html was not found."
            exit 1
          fi
          echo "Limouna Live web app found."

      - name: Prepare package configuration
        run: |
          cat > package.json <<'EOF'
          {
            "name": "limouna-live",
            "version": "1.0.0",
            "private": true,
            "description": "Limouna Live Android app"
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.limouna.live",
            "appName": "Limouna Live",
            "webDir": "web"
          }
          EOF

      - name: Prepare Android platform
        run: |
          if [ -f android/gradlew ] && \
             { [ -f android/app/build.gradle ] || [ -f android/app/build.gradle.kts ]; }; then
            echo "Existing Android project found."
          else
            echo "Android folder is incomplete. Recreating it in the temporary build environment."
            rm -rf android
            npx cap add android
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Limouna-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
